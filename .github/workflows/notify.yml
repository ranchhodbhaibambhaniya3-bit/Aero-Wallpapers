name: Auto Notification

on:
  push:
    paths:
      - 'wallpapers.json'

jobs:
  send_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Send FCM Notification
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          cat << 'EOF' > send.js
          const admin = require("firebase-admin");
          const fs = require('fs');

          // 🔥 1. JSON File read karke sabse latest wallpaper nikalna
          const rawData = fs.readFileSync('wallpapers.json');
          const wallpapers = JSON.parse(rawData);
          const latest = wallpapers[wallpapers.length - 1]; // Sabse aakhiri wallpaper

          const serviceAccount = JSON.parse(process.env.FIREBASE_KEY);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const payload = {
            notification: {
              title: `Aero: Naya ${latest.category} Wallpaper! 🌟`,
              body: `Check out '${latest.name}' - abhi screen par set karein.`,
              image: latest.imageUrl // 🔥 PINTEREST STYLE BIG IMAGE PREVIEW
            },
            android: {
              notification: {
                icon: "ic_notification",
                color: "#FFFFFF"
              }
            },
            data: {
              // 🔥 APP KE ANDAR DIRECT JANE KE LIYE DATA
              action: "open_wallpaper",
              imageUrl: latest.imageUrl,
              isLocked: String(latest.isLocked),
              wallpaperId: String(latest.id)
            },
            topic: "all_users"
          };

          admin.messaging().send(payload)
            .then(res => { console.log("Sent successfully:", res); process.exit(0); })
            .catch(err => { console.error("Error:", err); process.exit(1); });
          EOF
          node send.js
